# Site estático, sem build. Publica-se só a pasta site/ — o dossiê e os
# scripts nunca chegam ao servidor.
[build]
  publish = "site"
  command = ""

# Imagens: uma semana em cache. Não é «immutable» de um ano porque os
# ficheiros mantêm o nome quando são refeitos (ex.: as fotos do filme do
# hero) e quem já visitou o site continuaria a ver a versão antiga.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
